# Two services share one private host: `frontend` (Next.js) at `/` and `backend` (Spring Boot)
# at `/api`. Spec: valyalkin/hl-budget-spec specs/001-platform-foundation/contracts/deployment.md.
# Parameters marked REQUIRED must be set; the rest have safe defaults.
backend:
  workload:
    image:
      # -- REQUIRED: image name in ghcr.io/valyalkin. Set by the release workflow from homelab.yaml
      name: hl-budget-backend
      # -- REQUIRED: version tag; updated by scripts/bump-image.py on every release
      tag: "2-548d0ff"
      # -- REQUIRED: digest of that tag; updated by scripts/bump-image.py on every release
      digest: sha256:17598196aa55cc0b4696ea306e1979822d86701d3da8c5b88fb373477547672e
    # -- REQUIRED: memory limit. The JVM uses up to 75% of it (-XX:MaxRAMPercentage=75)
    resources:
      limits: {memory: 512Mi}
    # -- OPTIONAL: writable directories (the root filesystem is read-only)
    tmpDirs: [/tmp]
    # -- OPTIONAL: plain environment variables (never secrets)
    env:
      - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres-rw.postgres.svc.cluster.local:5432/hl_budget"}
      - {name: HLBUDGET_AUTH_ISSUER, value: "https://k8xv92p.ca.auth0.com/"}
      - {name: HLBUDGET_AUTH_AUDIENCE, value: "https://api.hl-budget.example"}
      - {name: HLBUDGET_AUTH_JWKSETURI, value: "https://k8xv92p.ca.auth0.com/.well-known/jwks.json"}
      - {name: HLBUDGET_AUTH_CLAIMSNAMESPACE, value: "https://hl-budget/"}
      - {name: LOGGING_LEVEL_ROOT, value: INFO}
    # -- OPTIONAL: HTTP probes. Startup allows 2 minutes for the JVM and Flyway
    probes:
      liveness: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
      readiness: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
      startup: {httpGet: {path: /healthz, port: http}, failureThreshold: 60, periodSeconds: 2}
  # -- REQUIRED: port 80 in the cluster, the container's port as targetPort
  service:
    ports: [{name: http, port: 80, targetPort: 8080}]
  ingress:
    # -- OPTIONAL: expose over HTTPS through Traefik
    enabled: true
    # -- REQUIRED when enabled: public hostname, shared with `frontend`
    host: hl-budget.home.example
    # -- OPTIONAL: path prefix, not stripped; the backend serves under /api
    path: /api
    # -- OPTIONAL: certificate Secret, synced from Vault by `frontend.secrets.tls`
    tls: {secretName: hl-budget-frontend-tls}
  # -- OPTIONAL: Postgres, by address; credentials generated into Vault by bootstrap/install.sh
  dependencies:
    postgres:
      host: postgres-rw.postgres.svc.cluster.local
      port: 5432
      credentials: {vaultPath: apps/hl-budget/postgres, keys: {username: SPRING_DATASOURCE_USERNAME, password: SPRING_DATASOURCE_PASSWORD}}
