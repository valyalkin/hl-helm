# Two services share one host, budget.valyalkin.com: `frontend` (Next.js) at `/` and `backend`
# (Spring Boot) at `/api`. Private: reachable at home and over Tailscale only (hl-budget-spec 005). Spec: valyalkin/hl-budget-spec specs/001-platform-foundation/contracts/deployment.md.
# Parameters marked REQUIRED must be set; the rest have safe defaults.
backend:
  workload:
    image:
      # -- REQUIRED: image name in ghcr.io/valyalkin. Set by the release workflow from homelab.yaml
      name: hl-budget-backend
      # -- REQUIRED: version tag; updated by scripts/bump-image.py on every release
      tag: "10-b9db8ec"
      # -- REQUIRED: digest of that tag; updated by scripts/bump-image.py on every release
      digest: sha256:75f7c8c3bedfba4de75a05366f17724f61a84d5e445a499075f7d972e8fc0958
    # -- REQUIRED: memory limit. The JVM uses up to 75% of it (-XX:MaxRAMPercentage=75)
    resources:
      limits: {memory: 512Mi}
    # -- OPTIONAL: writable directories (the root filesystem is read-only)
    tmpDirs: [/tmp]
    # -- OPTIONAL: plain environment variables (never secrets)
    env:
      - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres-rw.postgres.svc.cluster.local:5432/hl_budget"}
      - {name: HLBUDGET_AUTH_ISSUER, value: "https://k8xv92p.ca.auth0.com/"}
      - {name: HLBUDGET_AUTH_AUDIENCE, value: "https://api.hl-budget.example"}
      - {name: HLBUDGET_AUTH_JWKSETURI, value: "https://k8xv92p.ca.auth0.com/.well-known/jwks.json"}
      - {name: HLBUDGET_AUTH_CLAIMSNAMESPACE, value: "https://hl-budget/"}
      # Single app currency (ISO 4217); changing it later does not convert stored amounts
      - {name: HLBUDGET_MONEY_CURRENCY, value: "CAD"}
      # IANA zone that decides what "today" is (spendings cannot be dated in the future)
      - {name: HLBUDGET_TIMEZONE, value: "America/Toronto"}
      - {name: LOGGING_LEVEL_ROOT, value: INFO}
      # The API document and Swagger UI are not public on the shared host
      - {name: SPRINGDOC_API_DOCS_ENABLED, value: "false"}
      - {name: SPRINGDOC_SWAGGER_UI_ENABLED, value: "false"}
    # -- OPTIONAL: HTTP probes. Startup allows 2 minutes for the JVM and Flyway
    probes:
      liveness: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
      readiness: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
      startup: {httpGet: {path: /healthz, port: http}, failureThreshold: 60, periodSeconds: 2}
  # -- REQUIRED: port 80 in the cluster, the container's port as targetPort
  service:
    ports: [{name: http, port: 80, targetPort: 8080}]
  ingress:
    # -- OPTIONAL: expose over HTTPS through Traefik
    enabled: true
    # -- REQUIRED when enabled: hostname, shared with `frontend`. Served with Traefik's default
    # certificate (the shared *.valyalkin.com wildcard from infrastructure/ingress-tls)
    host: budget.valyalkin.com
    # -- OPTIONAL: path prefix, not stripped; the backend serves under /api
    path: /api
  # -- OPTIONAL: Postgres, by address; credentials generated into Vault by bootstrap/install.sh
  dependencies:
    postgres:
      host: postgres-rw.postgres.svc.cluster.local
      port: 5432
      credentials: {vaultPath: apps/hl-budget/postgres, keys: {username: SPRING_DATASOURCE_USERNAME, password: SPRING_DATASOURCE_PASSWORD}}
frontend:
  workload:
    image:
      # -- REQUIRED: image name in ghcr.io/valyalkin. Set by the release workflow from homelab.yaml
      name: hl-budget-frontend
      # -- REQUIRED: version tag; updated by scripts/bump-image.py on every release
      tag: "17-ac055d4"
      # -- REQUIRED: digest of that tag; updated by scripts/bump-image.py on every release
      digest: sha256:f596e5bc6606dc5cdbd1831135af95aaa57b643afd5e5b6f74c99b6145edbfd5
    # -- REQUIRED: memory limit for the Next.js standalone server
    resources:
      limits: {memory: 256Mi}
    # -- OPTIONAL: writable directories (the root filesystem is read-only)
    tmpDirs: [/tmp, /app/.next/cache]
    # -- OPTIONAL: plain environment variables (never secrets)
    env:
      - {name: APP_BASE_URL, value: "https://budget.valyalkin.com"}
      - {name: API_BASE_URL, value: "http://hl-budget-backend"}
      - {name: API_TIMEOUT_MS, value: "5000"}
      - {name: AUTH0_DOMAIN, value: "k8xv92p.ca.auth0.com"}
      # Public identifier, not a secret
      - {name: AUTH0_CLIENT_ID, value: "zvyqOJ4IaTklTQQl0lLuL1yL2reyScy4"}
      - {name: AUTH0_AUDIENCE, value: "https://api.hl-budget.example"}
    # -- OPTIONAL: HTTP probes
    probes:
      liveness: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
      readiness: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
      startup: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}
  # -- REQUIRED: port 80 in the cluster, the container's port as targetPort
  service:
    ports: [{name: http, port: 80, targetPort: 8080}]
  ingress:
    # -- OPTIONAL: expose over HTTPS through Traefik
    enabled: true
    # -- REQUIRED when enabled: hostname, shared with `backend`. Served with Traefik's default
    # certificate (the shared *.valyalkin.com wildcard)
    host: budget.valyalkin.com
    # -- OPTIONAL: path prefix; everything not under /api
    path: /
  # -- OPTIONAL: Vault secrets. The user writes the values; the chart only names the paths
  secrets:
    auth0: {vaultPath: apps/hl-budget/frontend, keys: {auth0_client_secret: AUTH0_CLIENT_SECRET, auth0_secret: AUTH0_SECRET}}
