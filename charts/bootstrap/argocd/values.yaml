# Values for the upstream `argo-cd` chart 10.10.5 live under the same key.
argo-cd:
  dex:
    enabled: false               # no SSO in a single-operator homelab
  notifications:
    enabled: false
  redis:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}
  controller:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  server:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
  repoServer:
    resources:
      requests: {cpu: 20m, memory: 128Mi}
      limits: {memory: 256Mi}
  applicationSet:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}
  redisSecretInit:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
