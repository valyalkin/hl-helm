{{- include "ingress-tls.validate" . -}}
# The Cloudflare API token, synced from Vault. Read only by the Issuer's DNS-01 solver.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  labels:
    {{- include "ingress-tls.labels" (dict "root" . "name" "cloudflare-api-token") | nindent 4 }}
spec:
  vaultAuthRef: {{ .Release.Name }}
  mount: kv
  type: kv-v2
  path: {{ .Values.cloudflare.vaultPath }}
  refreshAfter: {{ .Values.cloudflare.refreshAfter }}
  destination:
    create: true
    name: cloudflare-api-token
    type: Opaque
