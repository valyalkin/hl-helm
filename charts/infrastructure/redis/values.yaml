redis:
  workload:
    image:
      registry: docker.io
      owner: library
      name: redis
      tag: 8-alpine
      digest: sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}
    command: [sh, -c, 'exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"']
    tmpDirs: [/data]
  service:
    ports: [{name: redis, port: 6379}]
  secrets:
    auth:
      vaultPath: infra/redis
      keys: {password: REDIS_PASSWORD}

provision:
  enabled: true
  vaultAddr: http://vault.vault.svc.cluster.local:8200
  authMount: kubernetes
  kvMount: kv
  role: provision
  image:
    registry: docker.io
    owner: hashicorp
    name: vault
    tag: "2.0.4"
    digest: sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
  entries:
    - path: infra/redis
      generate: [password]

vaultAuth:
  role: infra
  createNamespace: false
