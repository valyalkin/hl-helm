# One database and role per application. `nginx` demonstrates the shape and proves the
# credential path end to end; replace or extend it as real applications arrive.
databases:
  - name: nginx
  - {name: hl_budget, namespace: hl-budget}   # Postgres names cannot contain a hyphen

# The homelab node runs Ubuntu kernel >= 7.0.0-43, where AppArmor blocks Postgres's own signals and
# crash recovery fails (hl-budget-spec 012). The chart default stays false.
cluster:
  appArmorUnconfined: true
