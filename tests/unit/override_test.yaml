suite: override a rendered section
templates: [templates/all.yaml]
release: {name: demo}
tests:
  - it: replaces the library service with the chart's override
    set:
      services.web.overrides.service: true
    documentSelector: {path: kind, value: Service}
    asserts:
      - equal: {path: spec.type, value: NodePort}
      - equal: {path: 'metadata.labels.overridden', value: "true"}
  - it: leaves other sections on the library rendering
    set:
      services.web.overrides.service: true
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.name, value: demo-web}
  - it: uses the library service when no override is declared
    documentSelector: {path: kind, value: Service}
    asserts:
      - equal: {path: spec.type, value: ClusterIP}
