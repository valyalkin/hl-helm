suite: naming and labels
templates: [templates/all.yaml]
release: {name: demo}
tests:
  - it: names resources release-scoped and labels them
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.name, value: demo-web}
      - equal: {path: 'metadata.labels["app.kubernetes.io/name"]', value: web}
      - equal: {path: 'metadata.labels["app.kubernetes.io/instance"]', value: demo}
      - equal: {path: 'metadata.labels["app.kubernetes.io/managed-by"]', value: Helm}
      - equal: {path: 'metadata.labels["app.kubernetes.io/part-of"]', value: hl-test}
  - it: selector labels exclude the version label
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - isNull: {path: 'spec.selector.matchLabels["app.kubernetes.io/version"]'}
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/version"]', value: "1.2.3"}
  - it: truncates long names to 53 characters
    release: {name: a-very-long-release-name-that-goes-on-and-on-and-on}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex: {path: metadata.name, pattern: "^.{1,53}$"}
      - notMatchRegex: {path: metadata.name, pattern: "^.{54,}$"}
