suite: secrets
templates: [templates/all.yaml]
release: {name: demo}
set:
  services.web.secrets:
    db: {vaultPath: apps/demo/db, keys: {password: DB_PASSWORD}}
tests:
  - it: renders a VaultStaticSecret with refresh and rollout restart
    documentSelector: {path: kind, value: VaultStaticSecret}
    asserts:
      - equal: {path: spec.path, value: apps/demo/db}
      - equal: {path: spec.refreshAfter, value: 1h}
      - equal: {path: spec.vaultAuthRef, value: demo}
      - equal: {path: spec.destination.name, value: demo-web-db}
      - equal: {path: 'spec.rolloutRestartTargets[0].name', value: demo-web}
      - equal: {path: 'spec.rolloutRestartTargets[0].kind', value: Deployment}
  - it: injects the key as an env var from the materialised secret
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: 'spec.template.spec.containers[0].env[0].name', value: DB_PASSWORD}
      - equal: {path: 'spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name', value: demo-web-db}
      - equal: {path: 'spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key', value: password}
  - it: omits the restart target when rolloutRestart is false
    set:
      services.web.secrets.db.rolloutRestart: false
    documentSelector: {path: kind, value: VaultStaticSecret}
    asserts:
      - isNull: {path: spec.rolloutRestartTargets}
  - it: fails naming the path when vaultPath is unset
    set:
      services.web.secrets.db.vaultPath: ""
    asserts:
      - failedTemplate: {errorPattern: "web.secrets.db.vaultPath"}
  - it: wires a private-registry pull secret from a VSO-materialised secret
    set:
      services.web.workload.image.pullSecret: ghcr
      services.web.secrets.ghcr: {vaultPath: shared/ghcr, type: kubernetes.io/dockerconfigjson}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: 'spec.template.spec.imagePullSecrets[0].name', value: demo-web-ghcr}
  - it: rejects a pull secret that names no secret entry
    set:
      services.web.workload.image.pullSecret: nowhere
    asserts:
      - failedTemplate: {errorPattern: "must name an entry"}
